# Newsstream user-editable configuration. Secrets live in .env, never here.

markets:
  crude_oil:
    threshold: 60            # materiality_score >= threshold gets dedup'd + surfaced
    review_band: 8           # triage score within +/- this of threshold -> re-run on review model
    rubric_weights:
      event_not_commentary: 3.0
      flow_impact: 3.0
      primary_source: 1.5
      specificity: 1.5
      novelty_prior: 1.0

