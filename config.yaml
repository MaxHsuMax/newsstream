telegram_channels: []
#  - channel: faytuks
#    tier: osint

# DECIDED 2026-09-10 (was OPEN, §14): Telegram + TwitterAPI.io push are the
# default sources; the official X API stays available as a budget-capped
# fallback. Running push and polling together is safe - posts dedup by id.

x_push:
  enabled: true              # TwitterAPI.io push feed: set X_PUSH_API_KEY in .env
  url: wss://ws.twitterapi.io/twitter/tweet/websocket
  rule_tag: newsstream       # tag prefix for the vendor-side filter rules this app manages
  # Vendor-side check cadence = your X latency floor AND the cost driver:
  # each check redelivers (and bills, $0.00015) the newest post, so
  # $/day ~= 86400/interval * 0.00015  ->  5s=$2.60  10s=$1.30  30s=$0.43
  # (measured live 2026-09-10; the pipeline dedups redeliveries by id).
  # 10s chosen 2026-09-11: latency > cost for this user. ~$40/mo.
  interval_seconds: 10

x_api:
  enabled: false             # official X API FALLBACK: flip on (with X_BEARER_TOKEN) if the push vendor has an outage
  poll_interval_seconds: 60
  daily_read_budget: 5000    # hard stop; adapter pauses + UI banner when hit (~$25/day at $0.005/read)

ui:
  max_stacked: 5
  stale_after_hours: 24

server:
  host: 127.0.0.1
  port: 8000
  db_path: ./data/newsstream.db

